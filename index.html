<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f7f5" />
    <title>Idealist</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        background: #f7f7f5;
        color: #161616;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f7f7f5;
      }

      main {
        width: min(100%, 440px);
        padding: 40px 28px 32px;
        text-align: center;
        background: #fff;
        border: 1px solid #e8e8e4;
        border-radius: 24px;
        box-shadow: 0 14px 40px rgb(0 0 0 / 7%);
      }

      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 22px;
        display: grid;
        place-items: center;
        border-radius: 20px;
        background: #ffd34f;
        font-size: 32px;
      }

      h1 { margin: 0; font-size: 25px; line-height: 1.3; }
      p { margin: 14px 0 0; color: #666; font-size: 16px; line-height: 1.6; }

      a {
        display: inline-block;
        margin-top: 28px;
        padding: 13px 24px;
        border-radius: 999px;
        background: #ffbd13;
        color: #161616;
        font-weight: 600;
        text-decoration: none;
      }

      .secondary { margin-top: 16px; font-size: 13px; color: #999; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">✦</div>
      <h1 id="title">正在打开 Idealist…</h1>
      <p id="message">请稍候。</p>
      <a id="open-app" class="hidden" href="#">打开 Idealist App</a>
      <p id="secondary" class="secondary"></p>
    </main>

    <script>
      (() => {
        const query = window.location.search;
        const hash = window.location.hash;
        const searchParams = new URLSearchParams(query);
        const hashParams = new URLSearchParams(hash.replace(/^#/, ''));
        const language = /^zh/i.test(navigator.language || '') ? 'zh' : 'en';
        const action = searchParams.get('flow') || searchParams.get('type') || hashParams.get('flow') || hashParams.get('type') || '';
        const isRecovery = action === 'recovery' || action === 'reset-password';
        const appPath = isRecovery ? 'auth/reset-password' : 'auth/confirm';
        const appUrl = `idealist://${appPath}${query}${hash}`;
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const title = document.getElementById('title');
        const message = document.getElementById('message');
        const openApp = document.getElementById('open-app');
        const secondary = document.getElementById('secondary');

        openApp.href = appUrl;

        if (isMobile) {
          title.textContent = language === 'zh' ? '正在返回 Idealist…' : 'Opening Idealist…';
          message.textContent = language === 'zh' ? '如果 App 没有自动打开，请点击下方按钮。' : 'If the app does not open automatically, use the button below.';
          openApp.classList.remove('hidden');
          secondary.textContent = language === 'zh' ? '请不要关闭当前页面。' : 'Please keep this page open.';

          window.location.replace(appUrl);
          return;
        }

        // Do not leave auth tokens in the desktop browser address bar.
        window.history.replaceState({}, document.title, window.location.pathname);
        title.textContent = isRecovery
          ? (language === 'zh' ? '请在 Idealist App 中重置密码' : 'Continue in the Idealist App')
          : (language === 'zh' ? '邮箱确认成功' : 'Email confirmed');
        message.textContent = isRecovery
          ? (language === 'zh' ? '请返回手机上的 Idealist App，继续完成密码重置。' : 'Return to the Idealist App on your phone to finish resetting your password.')
          : (language === 'zh' ? '请在手机上的 Idealist App 登录。' : 'Please sign in to Idealist on your phone.');
        secondary.textContent = language === 'zh' ? '你可以安全关闭此页面。' : 'You can safely close this page.';
      })();
    </script>
  </body>
</html>
